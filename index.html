<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101426;
      --panel: #1b2240;
      --text: #e9ecff;
      --snake: #4ade80;
      --snake-head: #22c55e;
      --food: #fb7185;
      --grid: #2a3155;
      --accent: #60a5fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(circle at top, #1d2854 0%, var(--bg) 55%);
      color: var(--text);
    }

    .game {
      width: min(92vw, 540px);
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid #3d4a80;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgb(0 0 0 / 35%);
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stats {
      display: flex;
      gap: 12px;
      font-weight: 600;
      font-size: 15px;
    }

    .pill {
      background: #283061;
      border: 1px solid #3d4a80;
      border-radius: 999px;
      padding: 6px 10px;
    }

    button {
      cursor: pointer;
      border: 0;
      color: white;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 30%);
      transition: transform .12s ease;
    }

    button:active { transform: translateY(1px); }

    canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 12px;
      border: 1px solid #33406f;
      background-color: #141a33;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 6.25% 6.25%;
    }

    .help {
      margin-top: 12px;
      color: #c6d0ff;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="topbar">
      <div class="stats">
        <span class="pill">分数：<strong id="score">0</strong></span>
        <span class="pill">最高分：<strong id="best">0</strong></span>
      </div>
      <button id="restart">重新开始</button>
    </div>

    <canvas id="board" width="480" height="480" aria-label="贪吃蛇游戏区域"></canvas>
    <p class="help">方向键/WASD 控制移动。每吃到一个食物都会加速一点，撞墙或咬到自己则结束。</p>
  </main>

  <script>
    const boardSize = 24;
    const tileSize = 20;
    const initialSpeed = 130;
    const speedStep = 3;

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const restartBtn = document.getElementById('restart');

    const directions = {
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
      w: [0, -1],
      s: [0, 1],
      a: [-1, 0],
      d: [1, 0],
    };

    let snake;
    let dir;
    let nextDir;
    let food;
    let score;
    let best;
    let speed;
    let timer;
    let alive;

    function loadBest() {
      const value = Number(localStorage.getItem('snake-best') || 0);
      return Number.isFinite(value) ? value : 0;
    }

    function randomFood() {
      while (true) {
        const pos = {
          x: Math.floor(Math.random() * boardSize),
          y: Math.floor(Math.random() * boardSize)
        };
        if (!snake.some(part => part.x === pos.x && part.y === pos.y)) {
          return pos;
        }
      }
    }

    function resetGame() {
      snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 },
      ];
      dir = [1, 0];
      nextDir = dir;
      score = 0;
      speed = initialSpeed;
      alive = true;
      food = randomFood();
      scoreEl.textContent = score;
      draw();
      loop();
    }

    function loop() {
      clearTimeout(timer);
      if (!alive) return;
      timer = setTimeout(() => {
        tick();
        loop();
      }, speed);
    }

    function setDirection(newDir) {
      if (!alive) return;
      const [nx, ny] = newDir;
      if (nx === -dir[0] && ny === -dir[1]) return;
      nextDir = newDir;
    }

    function tick() {
      dir = nextDir;
      const head = snake[0];
      const newHead = { x: head.x + dir[0], y: head.y + dir[1] };

      const hitWall = newHead.x < 0 || newHead.y < 0 || newHead.x >= boardSize || newHead.y >= boardSize;
      const hitSelf = snake.some(part => part.x === newHead.x && part.y === newHead.y);

      if (hitWall || hitSelf) {
        alive = false;
        draw();
        return;
      }

      snake.unshift(newHead);

      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        speed = Math.max(70, speed - speedStep);
        food = randomFood();
        if (score > best) {
          best = score;
          localStorage.setItem('snake-best', String(best));
          bestEl.textContent = best;
        }
      } else {
        snake.pop();
      }

      scoreEl.textContent = score;
      draw();
    }

    function drawCell(x, y, color, radius = 4) {
      const px = x * tileSize;
      const py = y * tileSize;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(px + 1, py + 1, tileSize - 2, tileSize - 2, radius);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawCell(food.x, food.y, getComputedStyle(document.documentElement).getPropertyValue('--food').trim(), 8);

      snake.forEach((part, idx) => {
        drawCell(part.x, part.y, idx === 0
          ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head').trim()
          : getComputedStyle(document.documentElement).getPropertyValue('--snake').trim()
        );
      });

      if (!alive) {
        ctx.fillStyle = 'rgb(0 0 0 / 55%)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 38px system-ui';
        ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 8);
        ctx.font = '16px system-ui';
        ctx.fillStyle = '#dbe4ff';
        ctx.fillText('按“重新开始”再来一局', canvas.width / 2, canvas.height / 2 + 28);
      }
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      const newDir = directions[key];
      if (!newDir) return;
      event.preventDefault();
      setDirection(newDir);
    });

    restartBtn.addEventListener('click', resetGame);

    best = loadBest();
    bestEl.textContent = best;
    resetGame();
  </script>
</body>
</html>
